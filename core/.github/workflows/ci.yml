name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testsuite:
    name: PHPUnit (PostgreSQL 17)
    runs-on: ubuntu-24.04

    # The integration suite runs against a REAL PostgreSQL 17 (RLS/policies,
    # pg_dump roundtrip, pgvector, advisory locks) — SQLite cannot cover it.
    # pgvector/pgvector:pg17 provides the `vector` extension that migrations
    # (CoreAi) require; `btree_gist` ships with the stock contrib set.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: fertura
          POSTGRES_USER: fertura
          POSTGRES_PASSWORD: fertura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fertura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The test connection is a superuser on `fertura_test` — the suite creates
      # its own roles (NOBYPASSRLS RLS role, per-module roles) and runs DDL.
      # During tests `Db::privileged()` resolves to this same connection
      # (`test_privileged` alias is unconfigured -> falls back to default), so
      # the whole suite is self-contained against `fertura_test`.
      DATABASE_URL: "postgres://fertura:fertura@localhost/fertura?encoding=utf8"
      DATABASE_TEST_URL: "postgres://fertura:fertura@localhost/fertura_test?encoding=utf8"
      SECURITY_SALT: f76f1c8475585c46c6acd3ddcb8f5e0f15de524637bb4080a08c4afe7cfc9144
      APP_ENCRYPTION_KEY: ci-encryption-key-change-me-fedcba9876543210

    steps:
    - uses: actions/checkout@v6

    # PostgreSQL 17 client: BackupRoundtripTest shells out to `pg_dump`/
    # `pg_restore`, which must match the server major (pg_dump refuses a newer
    # server). The Ubuntu default would be 16 -> install 17 from PGDG.
    - name: Install PostgreSQL 17 client
      run: |
        sudo install -d /usr/share/postgresql-common/pgdg
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
          | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends postgresql-client-17

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, intl, pdo_pgsql, pgsql, zip, sodium, gd
        ini-values: zend.assertions=1
        coverage: pcov

    - name: Composer install
      uses: ramsey/composer-install@v3

    - name: Composer post install
      run: composer run-script post-install-cmd --no-interaction

    # The Migrator builds the schema in `fertura_test`; the database itself must
    # already exist (the service container only created `fertura`).
    - name: Create test database
      run: PGPASSWORD=fertura psql -h localhost -U fertura -d fertura -c 'CREATE DATABASE fertura_test'

    # `composer test-coverage` runs the full PHPUnit suite with a Clover report
    # and then enforces the coverage ratchet (bin/coverage-check.php vs.
    # coverage-min.txt) — fails if line coverage drops below the committed floor.
    - name: Run PHPUnit + coverage ratchet
      run: composer test-coverage

  coding-standard:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl
        coverage: none
        tools: cs2pr, phpstan:1.12

    - name: Composer install
      uses: ramsey/composer-install@v3

    - name: Run PHP CodeSniffer
      run: vendor/bin/phpcs --report=checkstyle | cs2pr

    - name: Run phpstan
      if: always()
      run: phpstan
      env:
        SECURITY_SALT: f76f1c8475585c46c6acd3ddcb8f5e0f15de524637bb4080a08c4afe7cfc9144
