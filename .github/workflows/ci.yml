name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    name: PHPUnit (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fertura
          POSTGRES_PASSWORD: fertura
          POSTGRES_DB: fertura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fertura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        # Broker für den Job-Queue-Transport-Test (#10, Redis-Streams-Treiber).
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      # Test-DB wird vom Migrator (tests/bootstrap.php) aus den Migrationen gebaut.
      DATABASE_TEST_URL: "postgres://fertura:fertura@127.0.0.1/fertura_test?encoding=utf8"
      # Redis-Service des Runners (für den Job-Queue-Redis-Streams-Test).
      QUEUE_REDIS_URL: "tcp://127.0.0.1:6379"

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # sodium: Ed25519-Signaturen (Trust); zip: AES-256-Backups;
          # gd: von phpoffice/phpspreadsheet (P13) verlangt — muss zur
          # composer.lock-Plattformprüfung passen (sonst platform_check-Fatal).
          extensions: intl, pdo_pgsql, zip, mbstring, ctype, sodium, gd
          coverage: pcov

      - name: PostgreSQL-17-Client (pg_dump/pg_restore für Backup-Roundtrip)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Composer-Cache
        uses: actions/cache@v5
        with:
          path: core/vendor
          key: composer-${{ hashFiles('core/composer.lock') }}

      - name: Abhängigkeiten installieren
        working-directory: core
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests ausführen (mit Coverage)
        working-directory: core
        run: vendor/bin/phpunit --coverage-text --coverage-clover coverage.xml

      - name: Coverage-Gate (Ratschet, blockierend)
        working-directory: core
        # Bricht ab, wenn die Zeilenabdeckung unter core/coverage-min.txt fällt.
        # Das Minimum wird über die Zeit nur ANGEHOBEN, nie gesenkt.
        run: php bin/coverage-check.php coverage.xml

      - name: Statische Analyse (PHPStan Level 8, Baseline-gated)
        working-directory: core
        # Blockierend: bestehende Befunde sind in phpstan-baseline.neon
        # grandfathered, NEUE Fehler lassen die CI rot werden.
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Dependency-Advisories (composer audit, blockierend)
        working-directory: core
        # SCA: bekannte Sicherheitslücken in Produktiv-Abhängigkeiten brechen
        # die CI (Dev-Pakete laufen nicht in Produktion -> nur Hinweis).
        run: composer audit --no-dev --locked

      - name: Coding-Standard (PHPCS, informativ)
        working-directory: core
        # Nicht blockierend (Altbestand fehlender Docblocks); macht Verstöße
        # in neuen Änderungen sichtbar, ohne die CI zu brechen.
        continue-on-error: true
        run: vendor/bin/phpcs --report=summary
