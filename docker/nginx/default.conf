server {
    listen 80;
    server_name _;
    root /var/www/html/webroot;
    index index.php;

    client_max_body_size 32m;

    # Docker-interner DNS: Upstream pro Anfrage auflösen, statt die IP beim
    # Start zu cachen. Sonst liefert nginx nach einem Recreate von "core"
    # (neue Container-IP) 502 "Connection refused".
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        # Variable erzwingt Laufzeit-Auflösung über den resolver.
        set $upstream_core core:9000;
        fastcgi_pass $upstream_core;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
