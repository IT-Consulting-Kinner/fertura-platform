# Fertura – Dev-Umgebung ("clone & up")
# Getrennte Dienste gemäß Plattform-Dokument Kapitel 20.8:
# core (PHP-FPM) / web (Nginx) / db (PostgreSQL) / worker / mail (Mailpit)
name: fertura

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fertura}
      POSTGRES_USER: ${POSTGRES_USER:-fertura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fertura}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fertura}"]
      interval: 5s
      timeout: 5s
      retries: 12

  core:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - ./core:/var/www/html
      # vendor liegt auf einem Named Volume (ext4 in der VM), NICHT auf dem
      # 9p-Windows-Bind-Mount -> verhindert p9_client_rpc-Haenger beim Autoload.
      - core_vendor:/var/www/html/vendor
      # Geteilt mit dem Test-Marketplace-Server (signierte Fixtures schreiben).
      - ./marketplace-data:/var/www/html/marketplace-data
      # Managed Locale Store (i18n) auf persistentem ext4-Volume: atomarer
      # Rename funktioniert sauber; Sprachdateien ueberleben Recreates.
      - core_langstore:/var/www/html/language-store
      # Core-Backups (DB-Dump + Datei-Stores) auf persistentem Volume (E53).
      - core_backups:/var/www/html/backups
    environment:
      # Privilegierte Connection (Superuser): DDL/Migrationen/Bootstrap/Recovery.
      DATABASE_URL: "postgres://${POSTGRES_USER:-fertura}:${POSTGRES_PASSWORD:-fertura}@db/${POSTGRES_DB:-fertura}?encoding=utf8"
      # Default-Connection im Request-Pfad: NOBYPASSRLS-App-Rolle (RLS greift).
      APP_DB_USER: "${APP_DB_USER:-fertura_app}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:-fertura_app}"
      APP_DATABASE_URL: "postgres://${APP_DB_USER:-fertura_app}:${APP_DB_PASSWORD:-fertura_app}@db/${POSTGRES_DB:-fertura}?encoding=utf8"
      # System-/Identitaetsmails ueber den Mailpit-Dienst (Dev).
      EMAIL_TRANSPORT_DEFAULT_URL: "${EMAIL_TRANSPORT_DEFAULT_URL:-smtp://mail:1025}"
      DEBUG: "true"
      ROLE: core
      # Backup-Verschluesselung: Passwort OUT-OF-BAND (nicht im DB-Dump), damit
      # Desaster-Recovery moeglich ist. Vorrang: BACKUP_PASSWORD_FILE > BACKUP_PASSWORD.
      # BACKUP_PASSWORD: "${BACKUP_PASSWORD:-}"
      # BACKUP_PASSWORD_FILE: /run/secrets/backup_password
      SECURITY_SALT: "${SECURITY_SALT:-dev-salt-change-me-0123456789abcdef0123456789abcdef}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:-dev-encryption-key-change-me-fedcba9876543210}"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./core:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - core

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    # Outbox-Worker (Step 6): verarbeitet Events via LISTEN/NOTIFY + Poll-Fallback.
    command: ["bin/cake", "event_worker"]
    volumes:
      - ./core:/var/www/html
      - core_vendor:/var/www/html/vendor
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-fertura}:${POSTGRES_PASSWORD:-fertura}@db/${POSTGRES_DB:-fertura}?encoding=utf8"
      ROLE: worker
      SECURITY_SALT: "${SECURITY_SALT:-dev-salt-change-me-0123456789abcdef0123456789abcdef}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:-dev-encryption-key-change-me-fedcba9876543210}"
      # Geplante (verschluesselte) Backups laufen im Worker -> selbes Passwort wie core.
      # BACKUP_PASSWORD: "${BACKUP_PASSWORD:-}"
      # BACKUP_PASSWORD_FILE: /run/secrets/backup_password
      # Mehrere Worker-Instanzen sind moeglich (Outbox via SKIP LOCKED, Scheduler
      # via Advisory-Lock serialisiert) -> docker compose up -d --scale worker=N.
    depends_on:
      db:
        condition: service_healthy

  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web-UI
      - "1025:1025"   # SMTP

  # Test-Marketplace: serviert signierte Metadaten/CRL/Anker statisch (Step 8).
  marketplace:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./marketplace-data:/usr/share/nginx/html:ro
    ports:
      - "8090:80"

volumes:
  db_data:
  core_vendor:
  core_langstore:
  core_backups:
